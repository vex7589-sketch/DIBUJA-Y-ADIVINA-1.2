
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dibuja y Adivina</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    main {
      width: 100%;
      max-width: 650px;
      text-align: center;
      background: #1f2937;
      padding: 32px 20px;
      border-radius: 22px;
      border: 1px solid #374151;
    }
    h1 { font-size: 36px; margin-bottom: 8px; }
    p { color: #cbd5e1; line-height: 1.5; }
    .emoji { font-size: 55px; }
    .buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 25px;
    }
    button {
      padding: 15px 22px;
      border: 0;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #8b5cf6;
      color: white;
    }
    button:hover { filter: brightness(1.15); }
    .secondary { background: #374151; }
    #status {
      margin-top: 22px;
      padding: 14px;
      background: #111827;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="emoji">🎨</div>
    <h1>Dibuja y Adivina</h1>
    <p>¡Dibuja la palabra secreta y deja que tu amigo la adivine!</p>

    <div class="buttons">
      <button onclick="chooseRole('draw')">✏️ Quiero dibujar</button>
      <button class="secondary" onclick="chooseRole('guess')">💡 Quiero adivinar</button>
    </div>

    <div id="status">¡Prepárate para jugar!</div>
  </main>

  <script>
    function chooseRole(role) {
      const status = document.getElementById('status');

      if (role === 'draw') {
        status.textContent = '¡Pronto podrás dibujar! Estamos preparando tu partida.';
      } else {
        status.textContent = '¡Pronto podrás adivinar! Estamos preparando tu partida.';
      }
    }
  </script>
</body>
</html>
