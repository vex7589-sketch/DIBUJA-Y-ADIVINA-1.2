
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Dibuja y Adivina</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main>
    <header class="text-center">
      <h1>🎨 Dibuja y Adivina</h1>
      <p>¡Dibuja, adivina y diviértete con tus amigos!</p>
    </header>

    <section class="card">
      <h2>🎮 Crear o unirse a una partida</h2>
      <p>Cada jugador debe abrir el juego en su propio dispositivo.</p>

      <div class="buttons">
        <button id="createGame">✨ Crear partida</button>
      </div>

      <div class="join-area">
        <label for="roomCode">Código de la partida</label>
        <input id="roomCode" type="text" maxlength="6"
          placeholder="Escribe el código" autocomplete="off">
        <button id="joinGame" class="secondary">🚀 Unirme</button>
      </div>

      <p id="status" class="status">¡Listos para jugar!</p>
      <p id="roomDisplay" class="secret-word"></p>
    </section>

    <section class="card">
      <div class="game-header">
        <h2 id="gameTitle">Tu espacio de juego</h2>
        <div id="timer" class="timer">01:00</div>
      </div>

      <p id="secretWord" class="secret-word">TU PALABRA ES: —</p>

      <div class="drawing-tools">
        <div class="color-palette">
          <button class="color-button selected" data-color="#000000"
            style="background:#000000" aria-label="Negro"></button>
          <button class="color-button" data-color="#ffffff"
            style="background:#ffffff" aria-label="Blanco"></button>
          <button class="color-button" data-color="#ef4444"
            style="background:#ef4444" aria-label="Rojo"></button>
          <button class="color-button" data-color="#eab308"
            style="background:#eab308" aria-label="Amarillo"></button>
          <button class="color-button" data-color="#22c55e"
            style="background:#22c55e" aria-label="Verde"></button>
          <button class="color-button" data-color="#a855f7"
            style="background:#a855f7" aria-label="Morado"></button>
        </div>

        <label class="brush-size">
          Grosor
          <input id="brushSize" type="range" min="1" max="30" value="5">
        </label>

        <button id="clearCanvas" class="danger">🧹 Limpiar</button>
      </div>

      <div class="canvas-container">
        <canvas id="drawingCanvas"></canvas>
      </div>

      <div id="guessArea" class="join-area">
        <label for="guessInput">¿Qué palabra está dibujando?</label>
        <input id="guessInput" type="text"
          placeholder="Escribe tu respuesta" autocomplete="off">
        <button id="submitGuess">💡 Adivinar</button>
      </div>

      <div class="buttons">
        <button id="swapRoles" class="secondary">🔄 Intercambiar puestos</button>
      </div>
    </section>

    <footer class="text-center" style="padding:24px">
      <p>¡Que gane el más creativo!</p>
    </footer>
  </main>
</body>
</html>
